name: Bay Club ball machine watch

on:
  schedule:
    # UTC. Pacific (PDT, UTC-7): every 20 min from 6:04am to 1:44am, off 2-6am.
    # (When PST returns in November this shifts one hour earlier locally.)
    - cron: '4,24,44 0-8,13-23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ballmachine-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
      # Optional: ntfy.sh access token. Required for email forwarding —
      # without it the Email header is dropped (anonymous email is rejected).
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      # Optional dead-man's switch: a healthchecks.io (or equivalent) ping URL.
      # Unset = the heartbeat step is skipped and nothing else changes.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore state (session + dedup)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check with cached session
        id: cached
        run: node check.js --try-cached

      - name: Cache Playwright browser
        if: steps.cached.outputs.need_login == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (login needed)
        if: steps.cached.outputs.need_login == 'true'
        run: |
          # `--with-deps` runs `apt-get update`, which fails if ANY repo on the
          # runner image has stale metadata -- including third-party ones we
          # don't need. On 2026-09-09 a hash-sum mismatch on Google's Chrome
          # repo killed a run. Drop those lists, and retry the install.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/microsoft-prod*.list
          npm ci
          ok=
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "playwright install attempt $i failed; retrying in 20s"
            sleep 20
          done
          [ -n "$ok" ]

      - name: Login and check
        if: steps.cached.outputs.need_login == 'true'
        env:
          BAYCLUB_USERNAME: ${{ secrets.BAYCLUB_USERNAME }}
          BAYCLUB_PASSWORD: ${{ secrets.BAYCLUB_PASSWORD }}
        run: node check.js --login

      # A failure hook can only fire on a run that actually ran. If the trigger
      # itself dies -- as the Apps Script one did on 2026-09-01 -- GitHub does
      # nothing and says nothing. This heartbeat is the other half: an external
      # monitor alerts when the pings stop arriving.
      # Deliberately non-fatal. A missed ping is what the monitor is for, and
      # failing the job here would fire the failure alert for the same problem.
      - name: Heartbeat (dead-man's switch)
        if: success() && env.HEALTHCHECK_URL != ''
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 15 "$HEALTHCHECK_URL" > /dev/null \
            && echo "heartbeat sent" \
            || echo "heartbeat ping FAILED -- the monitor will report this as a missed check-in"

      # Must sit before "Save state" so the alert's own dedup timestamp is
      # written into the cache along with everything else.
      - name: Alert that the watcher itself is broken
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node check.js --alert-failure

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
